name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      TEST_ENV: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - name: Regression gate (UI + API)
        run: npm test
      - name: SQL scenarios
        run: npm run sql
      - name: Self-healing POC (offline heuristic unless ANTHROPIC_API_KEY is configured)
        run: npm run heal
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            reports/
            sql/results/
